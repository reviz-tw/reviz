<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ block "title" . }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ .Site.Params.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,700&family=Noto+Sans+TC:wght@400;500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
</head>
<body>

<div class="bg-grid" aria-hidden="true"></div>
<div class="bg-scan" aria-hidden="true"></div>

<div class="shell">

  <nav class="nav">
    <a href="{{ "" | relURL }}" class="nav-logo" aria-label="ReViz">
      <span class="wordmark">ReV<span class="wm-i">i<span class="wm-dot"></span></span>z</span>
      <span class="nav-tag">// 數位接案工作室</span>
    </a>

    <div class="nav-links">
      <a href="{{ "services/" | relURL }}" class="nav-link {{ if eq .Section "services" }}is-active{{ end }}">
        <span class="nav-num">01</span><span>服務</span><kbd>S</kbd>
      </a>
      <a href="{{ "portfolio/" | relURL }}" class="nav-link {{ if eq .Section "portfolio" }}is-active{{ end }}">
        <span class="nav-num">02</span><span>作品</span><kbd>W</kbd>
      </a>
      <a href="{{ "about/" | relURL }}" class="nav-link {{ if eq .Section "about" }}is-active{{ end }}">
        <span class="nav-num">03</span><span>關於</span><kbd>A</kbd>
      </a>
      <a href="{{ "contact/" | relURL }}" class="nav-link {{ if eq .Section "contact" }}is-active{{ end }}">
        <span class="nav-num">04</span><span>聯絡</span><kbd>C</kbd>
      </a>
      <span class="nav-divider"></span>
      <button class="nav-toggle" id="js-theme" type="button" aria-label="Toggle theme">◐ LIGHT</button>
    </div>
  </nav>

  <main>
    {{ block "main" . }}{{ end }}
  </main>

  <footer class="footer">
    <span>Copyright © ReViz 2025–2026</span>
  </footer>

</div>

<script>
  (function () {
    var btn = document.getElementById('js-theme');
    if (!btn) return;
    var root = document.documentElement;
    btn.addEventListener('click', function () {
      var isLight = root.classList.toggle('theme-light');
      btn.textContent = isLight ? '◑ DARK' : '◐ LIGHT';
    });
  })();
</script>
</body>
</html>
